<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="display.css">
    <title>CSS display property</title>

</head>

<body>

    <h2>
        CSS display property
    </h2>

    <h4>
        display: block
    </h4>
    <div class="container">
        <div class="block-item">
            Item 1
        </div>
        <div class="block-item">
            Item 2
        </div>
        <div class="block-item">
            Item 3
        </div>
    </div>

    <h4>
        display: flex
    </h4>
    <div class="flex-container">
        <div class="flex-item">
            Item 1
        </div>
        <div class="flex-item">
            Item 2
        </div>
        <div class="flex-item">
            Item 3
        </div>
    </div>

    <h4>
        display: grid
    </h4>
    <div class="grid-container">
        <div class="grid-item">
            Item 1
        </div>
        <div class="grid-item">
            Item 2
        </div>
        <div class="grid-item">
            Item 3
        </div>
        <div class="grid-item">
            Item 4
        </div>
        <div class="grid-item">
            Item 5
        </div>
        <div class="grid-item">
            Item 6
        </div>

    </div>

</body>

</html>
